<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crunchy Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Login screen ─────────────────────────────────── -->
  <section id="login-screen" class="screen">
    <div class="login-card">
      <div class="logo">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="30" fill="#F47521"/>
          <path d="M30 10C19 10 10 19 10 30s9 20 20 20 20-9 20-20S41 10 30 10zm0 6c7.7 0 14 6.3 14 14s-6.3 14-14 14-14-6.3-14-14 6.3-14 14-14zm0 4c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10z" fill="white"/>
        </svg>
        <h1>Crunchy<span>Browser</span></h1>
      </div>
      <p class="tagline">Sign in with your Crunchyroll account</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="error-msg hidden"></div>
        <button type="submit" id="login-btn">
          <span id="login-label">Sign In</span>
          <span id="login-spinner" class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </section>

  <!-- ── Browse screen ────────────────────────────────── -->
  <section id="browse-screen" class="screen hidden">

    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-icon">
          <circle cx="30" cy="30" r="30" fill="#F47521"/>
          <path d="M30 10C19 10 10 19 10 30s9 20 20 20 20-9 20-20S41 10 30 10zm0 6c7.7 0 14 6.3 14 14s-6.3 14-14 14-14-6.3-14-14 6.3-14 14-14zm0 4c-5.5 0-10 4.5-10 10s4.5 10 10 10 10-4.5 10-10-4.5-10-10-10z" fill="white"/>
        </svg>
        <span>CrunchyBrowser</span>
      </div>
      <div class="topbar-right">
        <span id="user-greeting"></span>
        <button id="logout-btn" class="btn-ghost">Sign out</button>
      </div>
    </header>

    <div class="browse-container">

      <!-- Filters -->
      <aside class="filters">
        <h2>Filters</h2>

        <div class="filter-group">
          <label for="search-input">Search</label>
          <input id="search-input" type="text" placeholder="Title…" />
        </div>

        <div class="filter-group">
          <label for="sort-select">Sort by</label>
          <select id="sort-select">
            <option value="popularity">Popularity</option>
            <option value="newly_added">Newly Added</option>
            <option value="alphabetical">Alphabetical</option>
            <option value="updated">Recently Updated</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="toggle-label">
            <input type="checkbox" id="rating-filter" />
            <span class="toggle-track"></span>
            Rating ≥ 4.4 only
          </label>
          <p class="filter-hint">Hides series rated below 4.4 stars</p>
        </div>

        <div class="filter-group">
          <label for="category-select">Category</label>
          <select id="category-select">
            <option value="">All categories</option>
          </select>
        </div>

        <button id="apply-btn" class="btn-primary">Apply</button>
        <button id="reset-btn" class="btn-ghost small">Reset</button>
      </aside>

      <!-- Results -->
      <main class="results">
        <div class="results-header">
          <h2 id="results-title">Fetching series…</h2>
          <span id="results-count" class="badge hidden"></span>
        </div>
        <div id="grid" class="grid"></div>
        <div id="empty-state" class="empty-state hidden">
          <p>No series matched your filters.</p>
        </div>
        <div id="load-more-wrap" class="load-more-wrap hidden">
          <button id="load-more-btn" class="btn-primary">Load more</button>
        </div>
      </main>

    </div>
  </section>

  <!-- ── Series modal ──────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <img id="modal-img" src="" alt="" class="modal-img" />
      <div class="modal-body">
        <h2 id="modal-title"></h2>
        <div class="modal-meta">
          <span id="modal-rating" class="rating-badge"></span>
          <span id="modal-provider"></span>
          <span id="modal-year"></span>
        </div>
        <p id="modal-desc"></p>
        <div id="modal-genres" class="modal-genres"></div>
        <a id="modal-link" href="#" target="_blank" rel="noopener" class="btn-primary">
          Watch on Crunchyroll →
        </a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
